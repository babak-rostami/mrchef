x-queue-worker: &queue-worker
  image: cooking-app
  restart: unless-stopped
  working_dir: /var/www
  volumes:
    - ./:/var/www
  depends_on:
    - app
    - postgres
    - redis
  networks:
    - cooking-network

x-general-worker: &general-worker
  <<: *queue-worker
  command: >
    php artisan queue:work --queue=default --tries=3 --timeout=120 --max-jobs=100 --max-time=3600

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: cooking-app
    container_name: cooking-app
    restart: unless-stopped
    working_dir: /var/www
    command: php-fpm
    volumes:
      - ./:/var/www
    networks:
      cooking-network:
        aliases:
          - cooking-app

  nginx:
    image: nginx:1.31
    container_name: cooking-nginx
    restart: unless-stopped
    ports:
      - "8005:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - cooking-network

  queue-general:
    <<: *general-worker
    container_name: cooking-queue-general

  postgres:
    image: postgres:18
    container_name: cooking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - cooking_postgres_data:/var/lib/postgresql
    networks:
      - cooking-network

  redis:
    image: redis:8.8
    container_name: cooking-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - cooking_redis_data:/data
    networks:
      - cooking-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: cooking-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"
    volumes:
      - cooking_es_data:/usr/share/elasticsearch/data
    networks:
      - cooking-network

volumes:
  cooking_postgres_data:
    driver: local
  cooking_redis_data:
    driver: local
  cooking_es_data:
    driver: local

networks:
  cooking-network:
    driver: bridge
