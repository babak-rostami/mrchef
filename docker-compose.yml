x-queue-worker: &queue-worker
  image: cooking-app
  restart: unless-stopped
  working_dir: /var/www
  volumes:
    - ./:/var/www
  depends_on:
    - app
    - redis
  networks:
    - music-network
    - cooking-network

x-general-worker: &general-worker
  <<: *queue-worker
  command: >
    php artisan queue:work --queue=default --tries=3 --timeout=120 --max-jobs=100 --max-time=3600

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: cooking-app
    container_name: cooking-app
    restart: unless-stopped
    working_dir: /var/www
    command: php-fpm
    volumes:
      - ./:/var/www
    networks:
      cooking-network:
        aliases:
          - cooking-app
      music-network:

  nginx:
    image: nginx:1.31
    container_name: cooking-nginx
    restart: unless-stopped
    ports:
      - "8005:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - cooking-network

  queue-general:
    <<: *general-worker
    container_name: cooking-queue-general

  redis:
    image: redis:8.8
    container_name: cooking-redis
    restart: unless-stopped
    volumes:
      - cooking_redis_data:/data
    networks:
      - cooking-network

volumes:
  cooking_redis_data:
    driver: local

networks:
  cooking-network:
    driver: bridge
  music-network:
    external: true
